name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find Project and Build APK
      run: |
        # gradlew 파일이 있는 실제 안드로이드 프로젝트 폴더 자동 검색
        GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*/*" | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found anywhere in the repository!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found android project in: $PROJECT_DIR"
        
        # 권한 부여 및 빌드 시작
        chmod +x "$GRADLEW_PATH"
        cd "$PROJECT_DIR"
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
